<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🛡️ Sulyap Admin Pro</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { createClient } = supabase;

    // CREDENTIALS
const SUPABASE_URL = 'https://zndkwygyxtbnlrpotgig.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZGt3eWd5eHRibmxycG90Z2lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0Nzc4NDIsImV4cCI6MjA4NDA1Mzg0Mn0.tYehNMuOHyyRABR08aCr6NImgtKnjxSDBFc3Uz07BRc';

    // This must match the SQL Policy header exactly to fix the 401 error
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: {
        headers: {
          'x-admin-passcode': '3jK#92!LpZ*q7Xv@1nM' 
        }
      }
    });

    function AdminDashboard() {
      const [posts, setPosts] = useState([]);
      const [stats, setStats] = useState({ total: 0, visible: 0, flagged: 0, banned: 0 });
      const [search, setSearch] = useState('');
      const [loading, setLoading] = useState(true);

      const fetchData = async () => {
        try {
          // Fetch Posts
          const { data } = await supabaseClient
            .from('unspoken_words')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(200);

          // Fetch Stats
          const { count: total } = await supabaseClient.from('unspoken_words').select('*', { count: 'exact', head: true });
          const { count: visible } = await supabaseClient.from('unspoken_words').select('*', { count: 'exact', head: true }).eq('is_visible', true);
          const { count: flagged } = await supabaseClient.from('unspoken_words').select('*', { count: 'exact', head: true }).eq('is_flagged', true);
          const { count: banned } = await supabaseClient.from('blacklisted_fingerprints').select('*', { count: 'exact', head: true });

          setPosts(data || []);
          setStats({ total: total || 0, visible: visible || 0, flagged: flagged || 0, banned: banned || 0 });
          setLoading(false);
        } catch (e) { console.error(e); }
      };

      useEffect(() => {
        fetchData();
        const sub = supabaseClient.channel('admin_room').on('postgres_changes', { event: '*', schema: 'public', table: 'unspoken_words' }, () => fetchData()).subscribe();
        return () => supabaseClient.removeChannel(sub);
      }, []);

      // Filter posts based on search
      const filteredPosts = useMemo(() => {
        return posts.filter(p => p.text.toLowerCase().includes(search.toLowerCase()));
      }, [posts, search]);

      const handleHide = async (id) => {
        await supabaseClient.from('unspoken_words').update({ is_visible: false, is_flagged: true }).eq('id', id);
        fetchData();
      };

      const handleBan = async (post) => {
        if (!confirm(`🚫 PERMA-BAN USER?\n\nThis will blacklist this ID and hide all their messages.`)) return;
        try {
          await supabaseClient.from('blacklisted_fingerprints').insert({
            ip_hash: post.daily_token,
            fingerprint: post.fingerprint,
            reason: `Manual ban: ${post.text.slice(0, 30)}`
          });
          await supabaseClient.from('unspoken_words').update({ is_visible: false, is_flagged: true }).eq('daily_token', post.daily_token);
          alert("User Banned & Content Removed");
          fetchData();
        } catch (e) { alert("Error banning user. Check SQL Policy."); }
      };

      const handleWipe = async () => {
        if (!confirm("Wipe all 'Hacking' and 'GCASH' spam?")) return;
        await supabaseClient.from('unspoken_words').update({ is_visible: false, is_flagged: true }).or('text.ilike.%hacking%,text.ilike.%gcash%');
        fetchData();
      };

      if (loading) return <div className="flex h-screen items-center justify-center bg-slate-950 text-blue-400 font-bold animate-pulse">INITIALIZING SECURE LINK...</div>;

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col pb-10 px-4">
          {/* Header */}
          <header className="sticky top-0 bg-slate-950/80 backdrop-blur-md pt-6 pb-4 z-10">
            <div className="flex justify-between items-center mb-4">
              <h1 className="text-xl font-black tracking-tighter text-white">🛡️ SULYAP ADMIN</h1>
              <button onClick={handleWipe} className="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-black shadow-lg shadow-red-900/40 uppercase">Wipe Spam</button>
            </div>
            
            {/* Stats Grid */}
            <div className="grid grid-cols-4 gap-2 mb-4">
              {[
                { label: 'Total', val: stats.total, color: 'text-white' },
                { label: 'Live', val: stats.visible, color: 'text-green-400' },
                { label: 'Flag', val: stats.flagged, color: 'text-red-400' },
                { label: 'Banned', val: stats.banned, color: 'text-orange-400' }
              ].map(s => (
                <div key={s.label} className="bg-slate-900 border border-slate-800 p-2 rounded-lg text-center">
                  <p className="text-[10px] uppercase font-bold text-slate-500">{s.label}</p>
                  <p className={`text-lg font-black ${s.color}`}>{s.val}</p>
                </div>
              ))}
            </div>

            <input 
              type="text" 
              placeholder="Search keywords (GCASH, Hacking...)" 
              className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-blue-500 outline-none transition-all"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
            />
          </header>

          {/* Post Feed */}
          <main className="flex-1 space-y-3">
            {filteredPosts.map(post => (
              <div key={post.id} className={`p-4 rounded-2xl border transition-all ${post.is_flagged ? 'border-red-900/50 bg-red-900/5' : 'border-slate-800 bg-slate-900/50'}`}>
                <p className="text-sm leading-relaxed mb-3 text-slate-200">{post.text}</p>
                <div className="flex justify-between items-center">
                  <span className="text-[10px] text-slate-600 font-mono uppercase">
                    {new Date(post.created_at).toLocaleTimeString()} • {post.daily_token.slice(0,6)}
                  </span>
                  <div className="flex gap-2">
                    {post.is_visible && (
                      <button onClick={() => handleHide(post.id)} className="px-3 py-1.5 bg-slate-800 text-slate-300 text-[11px] font-bold rounded-md hover:bg-slate-700">HIDE</button>
                    )}
                    <button onClick={() => handleBan(post)} className="px-3 py-1.5 bg-red-600/10 text-red-500 border border-red-600/20 text-[11px] font-bold rounded-md hover:bg-red-600 hover:text-white transition-colors">BAN</button>
                  </div>
                </div>
              </div>
            ))}
            {filteredPosts.length === 0 && <div className="text-center py-20 text-slate-600 text-sm">No messages found.</div>}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminDashboard />);
  </script>
</body>
</html>
