<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulyap | Under Maintenance</title>
    <style>
        :root {
            --primary-color: #2d3436;
            --accent-color: #0984e3;
            --text-gray: #636e72;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--primary-color);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .logo span {
            color: var(--accent-color);
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #dfe6e9;
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: #dfe6e9;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">SULYAP<span>.</span></div>
        <div class="loader"></div>
        <h1>Sandali lang...</h1>
        <p>We're currently updating Sulyap to give you a better experience. We’ll be back online shortly. Thank you for your patience!</p>
        <div class="badge">SYSTEM UPDATE IN PROGRESS</div>
    </div>

</body>
</html>
