<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulyap | Maintenance</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #d1d1d1;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .logo {
            font-size: 2rem;
            letter-spacing: 0.5rem;
            color: #ff5722;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .status {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 30px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 2px solid #333;
            border-top: 2px solid #ff5722;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            max-width: 300px;
            line-height: 1.6;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Sulyap</div>
        <div class="status">Hearts Listening: 0</div>
        <div class="loader"></div>
        <p>Quietly cleaning the archive. We'll be back shortly to hear your secrets again.</p>
    </div>
</body>
</html>
