<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sulyap-icon.png" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0" />
    <title>Sulyap | Service Paused</title>
    
    <style>
      body {
        margin: 0;
        background-color: #09090b;
        color: #ffffff;
        font-family: -apple-system, system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }

      .container {
        padding: 40px 20px;
        max-width: 400px;
      }

      h1 {
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        margin-bottom: 25px;
        opacity: 0.9;
      }

      .message-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 25px;
        border-radius: 24px;
        margin-bottom: 30px;
      }

      p {
        font-size: 15px;
        color: #a1a1aa;
        line-height: 1.6;
        margin: 0;
      }

      .alert {
        color: #f87171; /* Soft red */
        font-weight: 600;
        display: block;
        margin-bottom: 10px;
      }

      .qr-card {
        background: #ffffff;
        padding: 16px;
        border-radius: 28px;
        display: inline-block;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }

      .qr-card img {
        width: 220px;
        height: 220px;
        display: block;
        border-radius: 12px;
      }

      .gcash-tag {
        margin-top: 18px;
        color: #3b82f6; 
        font-weight: 800;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 2px;
      }

      .footer-text {
        margin-top: 30px;
        font-size: 11px;
        opacity: 0.3;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>

    <div class="container">
      <h1>Sulyap is on hold</h1>
      
      <div class="message-card">
        <p>
          <span class="alert">The free trial has ended and the database has exceeded its limit.</span>
          We are currently finding money to continue this website. Any support helps us stay online.
        </p>
      </div>

      <div class="qr-card">
        <img src="/gcash-qr.jpg" alt="GCash Donation QR">
      </div>

      <div class="gcash-tag">Donate via GCash</div>
      
      <p class="footer-text">
        Thank you for helping us keep Sulyap alive.
      </p>
    </div>

  </body>
</html>
