<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sulyap-icon.png" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0" />
    <title>Sulyap | On Hold</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
      :root {
        --bg: #09090b;
        --card-bg: rgba(255, 255, 255, 0.03);
        --accent: #3b82f6;
        --error: #f87171;
      }

      body {
        margin: 0;
        background-color: var(--bg);
        color: #ffffff;
        font-family: -apple-system, system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }

      .container {
        padding: 40px 20px;
        max-width: 420px;
        width: 100%;
      }

      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        margin-bottom: 25px;
        font-weight: 700;
      }

      .status-card {
        background: var(--card-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 25px;
        border-radius: 24px;
        margin-bottom: 30px;
      }

      .alert-text {
        color: var(--error);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 10px;
      }

      p {
        font-size: 14px;
        color: #d4d4d8;
        line-height: 1.6;
        margin: 0;
      }

      .qr-wrapper {
        background: #ffffff;
        padding: 16px;
        border-radius: 28px;
        display: inline-block;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        margin-bottom: 20px;
      }

      .qr-wrapper img {
        width: 200px;
        height: 200px;
        display: block;
        border-radius: 10px;
      }

      .gcash-label {
        color: var(--accent);
        font-weight: 800;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 20px;
      }

      /* Social Media Links Section */
      .social-links {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 10px;
      }

      .social-item {
        color: #ffffff;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.05);
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        font-size: 18px;
      }

      .social-item:hover {
        background: var(--accent);
        transform: translateY(-3px);
        border-color: var(--accent);
      }

      .handle-text {
        display: block;
        margin-top: 15px;
        font-size: 12px;
        opacity: 0.6;
        letter-spacing: 1px;
      }

      .footer-note {
        margin-top: 40px;
        font-size: 10px;
        opacity: 0.3;
        line-height: 1.5;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>

    <div class="container">
      <img src="/sulyap-icon.png" alt="Sulyap Logo" class="logo">
      
      <h1>Sulyap On Hold</h1>
      
      <div class="status-card">
        <span class="alert-text">Free trial over • Database limit exceeded</span>
        <p>
          We are currently finding money to continue this website. Your support helps us keep the whispers alive.
        </p>
      </div>

      <div class="qr-wrapper">
        <img src="/gcash-qr.jpg" alt="GCash Donation QR">
      </div>

      <div class="gcash-label">Donate via GCash</div>
      
      <div class="social-links">
        <a href="https://www.facebook.com/kelllllll/" target="_blank" class="social-item" title="Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://www.instagram.com/kelcrz30/" target="_blank" class="social-item" title="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@nykelcrz" target="_blank" class="social-item" title="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
      </div>
      
      <span class="handle-text">@kel</span>
      
      <p class="footer-note">
        Every contribution goes to database & domain costs.
      </p>
    </div>

  </body>
</html>
